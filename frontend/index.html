<script id="cc750-submit-profile-reload-recovery">
(function(){
  'use strict';
  try {
    if (String(location.pathname||'').replace(/\/+$/,'') !== '/candidate/new') return;
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (!nav || nav.type !== 'reload') return;
    var id = String(sessionStorage.getItem('cc750_adopted_candidate_id') || '').trim();
    if (!/^C[0-9A-Za-z_-]+$/.test(id)) return;
    location.replace('/candidate/' + encodeURIComponent(id) + (location.search||'') + (location.hash||''));
  } catch(_e) {}
})();
</script>

<script id="cc628-attendance-session">
/* One narrow manager fetch per authenticated login; zero periodic GET. */
(function(){'use strict';if(window.__CC628_ATTENDANCE__)return;window.__CC628_ATTENDANCE__=true;
var running=false,closed=false,el=null,attempts=0;
function user(){try{return JSON.parse(localStorage.getItem('careerCroxCachedUser')||'null')}catch(_){return null}}
function dismiss(){if(el)el.remove();el=null}
function boot(){if(running||closed||window.__CC602_NETWORK_PAUSED__||location.pathname==='/login'||document.hidden)return;
 var u=user(),role=String(u&&(u.role||u.designation)||'').toLowerCase();
 if(!u||!u.user_id){if(++attempts<6)setTimeout(boot,1500);return;}
 if(!['manager','admin'].includes(role)){closed=true;return;}
 var login=String(localStorage.getItem('careerCroxSessionLoginAt')||'');
 var sessionKey='cc628.attendance.once:'+String(u.user_id)+':'+login;
 try{if(sessionStorage.getItem(sessionKey)){closed=true;return;}sessionStorage.setItem(sessionKey,'checked');}catch(_){}
 running=true;fetch('/api/approvals/attendance-pending',{credentials:'include',cache:'no-store'})
 .then(function(r){if(!r.ok)throw Error('Attendance check unavailable');return r.json()})
 .then(function(d){if(!d||!d.count||window.__CC602_NETWORK_PAUSED__||location.pathname==='/login')return;
 dismiss();var card=document.createElement('aside');card.id='cc628-attendance-prompt';card.setAttribute('role','dialog');card.setAttribute('aria-label','Pending attendance decisions');
 var h=document.createElement('strong');h.textContent=(d.count>=50?'50+':String(d.count))+' attendance decision'+(d.count===1?'':'s')+' pending';
 var p=document.createElement('p');p.textContent='These reports remain saved until you review them. You can choose a day status now or next time you sign in.';
 var actions=document.createElement('div');actions.className='cc628-actions';
 var open=document.createElement('button');open.type='button';open.textContent='Review reports';open.onclick=function(){dismiss();location.assign('/approvals')};
 var later=document.createElement('button');later.type='button';later.textContent='Remind next login';later.onclick=dismiss;
 actions.append(open,later);card.append(h,p,actions);document.body.append(card);el=card;
 }).catch(function(){/* no repeated failed network reads */}).finally(function(){running=false;closed=true});
}
window.addEventListener('career-crox-idle-lock-begin',function(){closed=true;dismiss()});
window.addEventListener('pageshow',boot,{once:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else setTimeout(boot,500);
document.addEventListener('visibilitychange',function(){if(!document.hidden)boot()});
})();
</script>
