services:
  - type: web
    name: career-crox-interns
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: BASIC_CRM_MODE
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: ALLOWED_ORIGINS
        value: https://career-crox-interns.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_POSTGRES
        value: true
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        value: 10
      - key: PG_QUERY_TIMEOUT_MS
        value: 22000
      - key: PG_STATEMENT_TIMEOUT_MS
        value: 22000
      - key: CRM_HOT_LEADS_MANAGER_MAX_ROWS
        value: 200
      - key: CRM_DIALER_MAX_SELECTION
        value: 200
      - key: DIALER_LIVE_STATUS_CACHE_MS
        value: 12000
      - key: DIALER_DEFAULT_QUEUE_LIMIT
        value: 80
      - key: CRM_RECORDING_UPLOAD_MAX_BYTES
        value: 18874368
      - key: VITE_MIN_ACTIVE_POLL_MS
        value: 300000
      - key: VITE_MIN_HIDDEN_POLL_MS
        value: 1800000
      - key: BOOTSTRAP_ON_START
        value: false
      - key: VITE_AUTO_SYSTEM_POPUPS
        value: false
      - key: VITE_AUTO_SEMI_HOURLY_POPUPS
        value: false
      - key: VITE_IDLE_AUTO_PAUSE_MS
        value: 300000
      - key: VITE_STALE_CACHE_MAX_AGE_MS
        value: 43200000
      - key: VITE_STALE_CACHE_MAX_BYTES
        value: 1400000

      - key: CRM_INACTIVITY_LOGOUT_MS
        value: 600000
      - key: VITE_CRM_INACTIVITY_LOGOUT_MS
        value: 600000
      - key: MOBILE_IDLE_POLL_SECONDS
        value: 60
      - key: MOBILE_WAITING_POLL_SECONDS
        value: 5
      - key: MOBILE_ACTIVE_POLL_SECONDS
        value: 1